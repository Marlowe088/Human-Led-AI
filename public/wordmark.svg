<svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human-Led AI">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=IBM+Plex+Mono:wght@600&amp;display=swap');
      .human {
        font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-style: italic;
        font-size: 64px;
        fill: #1A1A18;
      }
      .led {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-size: 30px;
        fill: #1A1A18;
        fill-opacity: 0.5;
      }
      .ai {
        font-family: 'IBM Plex Mono', 'Courier New', monospace;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: 6px;
        fill: #2E3A59;
      }
      .rule {
        stroke: #2E3A59;
        stroke-width: 2;
      }
    </style>
  </defs>

  <text x="0" y="72" class="human">Human</text>
  <text x="217" y="72" class="led">-Led</text>

  <line x1="0" y1="98" x2="285" y2="98" class="rule" />

  <text x="0" y="140" class="ai">AI</text>
</svg>
